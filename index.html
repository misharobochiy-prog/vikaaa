<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Will you be my Valentine?</title>

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e0, #cdeac0);
      font-family: Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      max-width: 340px;
      width: 90%;
    }

    h1 {
      margin: 20px 0;
    }

    /* 🔹 ВІДЕО / GIF */
    .gif video {
      width: 100%;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 25px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 8px;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #6c757d;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- 🔴 ТУТ ВСТАВЛЯЄТЬСЯ ГІФКА / ВІДЕО -->
    <div class="gif">
      <video autoplay loop muted playsinline>
        <source src="valentine.mp4" type="video/mp4">
      </video>
    </div>

  
    <h1>Будеш моєю валентинкоою? 💖</h1>


    <div>
      <button id="yes">Канєшно так 💘</button>
      <button id="no">Нєє 😐</button>
    </div>

  </div>


  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");

    const noTexts = [
      "Точно ні? 🤨",
      "Прям зовсім? 😳",
      "Подумай ще раз 🥺",
      "Ай…💔",
      "Пліііііз 😭",
      "Мені сумно 😤",
      "Останній шанс 😢",
      "Добре… я здаюсь 😞"
    ];

    let clicks = 0;
    let yesScale = 1;

    noBtn.addEventListener("click", () => {
      clicks++;
      yesScale += 0.3;
      yesBtn.style.transform = `scale(${yesScale})`;

      if (clicks < noTexts.length) {
        noBtn.textContent = noTexts[clicks];
      }

      if (clicks >= 8) {
        noBtn.style.display = "none";
      }
    });

    yesBtn.addEventListener("click", () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          flex-direction:column;
          justify-content:center;
          align-items:center;
          background:linear-gradient(135deg,#ffafcc,#ffc8dd);
          font-family:Arial;
          text-align:center;
        ">
          <h1 style="font-size:46px;color:#ff006e;">ЄЄЄЄЄЄЄЄЄЄЄ УРААА 💕</h1>
          <p style="font-size:22px;">Найкраще рішення евер, люблю тебее 😌</p>
        </div>
      `;
    });
  </script>

</body>
</html>
